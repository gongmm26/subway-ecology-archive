  :root {
    --ground: #FBFBFB;      /* 이미지 ① 배경색 · 팝업 카드 테두리색 */
    --ink: #2B2B2B;         /* 이름표 · 관계 텍스트 색 */
    --debug: #d4002a;
    --font-name: "SEA Inter", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-rel: "SEA Pretendard", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --font-ui: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); }
  /* 16:9 무대: 화면 크기와 관계없이 노선도와 오버레이가 같은 영역을 공유 */
  #stage {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
    overflow: hidden; touch-action: none;
  }
  #root { position: absolute; inset: 0; }
  .stage { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; }
  .name { font-family: var(--font-name); font-weight: 700; fill: var(--ink); }
  .rel-en, .rel-kr { font-family: var(--font-rel); font-size: 16px; fill: var(--ink); }
  .rel-en { font-weight: 600; }
  .rel-kr { font-weight: 400; }
  .icons, .legend { pointer-events: none; }
  .dbg-text { font: 600 18px/1 ui-monospace, Menlo, monospace; fill: var(--debug); paint-order: stroke; stroke: var(--ground); stroke-width: 4px; }

  /* ---- 오버레이 (1920×1080 기준 좌표, 무대 크기에 맞춰 축소) ---- */
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .ov-scale { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .ov-hover {
    position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid var(--ink); background: rgba(255,255,255,0.28); box-sizing: border-box;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.7), 0 0 10px rgba(43,43,43,0.25);
  }
  .ov-cursor {
    position: absolute; left: 0; top: 0; width: 0; height: 0;
  }
  .ov-cursor::before {
    content: ""; position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.85); border: 3px solid var(--ink); box-sizing: border-box;
    box-shadow: 0 0 6px rgba(43,43,43,0.3); transition: transform 120ms ease-out, background-color 120ms;
  }
  .ov-cursor.over::before { transform: scale(1.15); }
  .ov-cursor.fist::before { transform: scale(0.7); background: var(--ink); }

  /* 개별영상 팝업 카드 (Image E: 20px 테두리 #FBFBFB, 모서리 20 기준, 그림자 2겹) */
  .ov-card {
    position: absolute; width: 727px; height: 555px; box-sizing: border-box; /* 실제 크기는 interaction.js에서 영상 비율로 계산 */
    border: 20px solid var(--ground); border-radius: 30px; background: var(--ground);
    box-shadow: 0 0 2px 0 rgba(43,43,43,0.20), 0 0 8px 0 rgba(43,43,43,0.20);
    opacity: 0; transform: scale(var(--from-scale, 0.96)); transform-origin: 50% 50%;
    transition-property: opacity, transform; transition-timing-function: ease-out;
  }
  .ov-card.show { opacity: 1; transform: scale(1); }
  .ov-card.hide { opacity: 0; transform: scale(1); transition-timing-function: ease-in; }
  .ov-media { position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background: var(--ground); }
  .ov-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 50%; display: block; background: var(--ground); }
  .ov-tab {
    position: absolute; left: 0; top: 0; height: 35px; padding: 0 10px 0 6px; box-sizing: border-box;
    display: flex; align-items: baseline; gap: 5px; background: var(--ground); border-bottom-right-radius: 14px;
    color: var(--ink); line-height: 35px;
  }
  .ov-en { font-family: var(--font-name); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .ov-kr { font-family: var(--font-rel); font-weight: 400; font-size: 11px; }
  .ov-fallback {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 40px; text-align: center; color: var(--ink); font-family: var(--font-ui);
  }
  .ov-fallback[hidden] { display: none; }
  .ov-fallback strong { font-size: 26px; font-weight: 600; }
  .ov-fallback span { font-size: 17px; color: #66666A; max-width: 30em; line-height: 1.5; }

  /* 카메라 입력 video — 손동작 분석 전용, 화면에는 보이지 않음 */
  .ov-cam-hidden { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; z-index: -1; }
  @media (prefers-reduced-motion: reduce) { .ov-card { transition-duration: 1ms !important; } }
</style>

/* ---------- 6. 폴리라인 기하 ---------- */
function buildGeometry(points) {
  const segs = [];
  let acc = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const [x0, y0] = points[i], [x1, y1] = points[i + 1];
    const len = Math.hypot(x1 - x0, y1 - y0);
    segs.push({ x0, y0, x1, y1, len, s0: acc });
    acc += len;
  }
  return { segs, length: acc };
}
function pointAt(geo, s) {
  const segs = geo.segs;
  if (s <= 0) return { x: segs[0].x0, y: segs[0].y0 };
  for (const g of segs) {
    if (s <= g.s0 + g.len) {
      const u = g.len ? (s - g.s0) / g.len : 0;
      return { x: g.x0 + (g.x1 - g.x0) * u, y: g.y0 + (g.y1 - g.y0) * u };
    }
  }
  const g = segs[segs.length - 1];
  return { x: g.x1, y: g.y1 };
}
/** 점을 폴리라인에 투영 → { s, d } (누적 거리, 수직 거리) */
function project(geo, px, py) {
  let best = { s: 0, d: Infinity };
  for (const g of geo.segs) {
    const dx = g.x1 - g.x0, dy = g.y1 - g.y0;
    let u = ((px - g.x0) * dx + (py - g.y0) * dy) / (g.len * g.len);
    u = Math.max(0, Math.min(1, u));
    const qx = g.x0 + dx * u, qy = g.y0 + dy * u;
    const d = Math.hypot(px - qx, py - qy);
    if (d < best.d - 1e-9) best = { s: g.s0 + g.len * u, d };
  }
  return best;
}
const pathD = pts => 'M' + pts.map(p => p[0] + ' ' + p[1]).join(' L');

const segIndexAt = (geo, s) => {
  const segs = geo.segs;
  for (let i = 0; i < segs.length; i++) if (s <= segs[i].s0 + segs[i].len) return i;
  return segs.length - 1;
};

/* ---------- 6-2. 관계 정보 바 (경로 추종형, 3차 수정) ----------
 * 관계 정보 하나 = 흰색 반투명 바 + 관계 SVG 아이콘 + 영문(SemiBold) + 한글(Regular).
 * 바·아이콘·글자는 모두 "가이드 경로" 위에 놓입니다.
 *   가이드 경로 = 노선 경로를 글자 윗면 쪽으로 REL_BAR_OFFSET만큼 평행 이동하고,
 *                 그 꺾임만 REL_GUIDE_RADIUS로 둥글린 선 (관계 정보 렌더링 전용).
 *   노선 SVG 경로와 캐릭터 이동 좌표는 그대로입니다.
 * 바는 가이드 경로의 짧은 구간을 잘라 만든 띠이므로 꺾임에서 실제로 휘어지고,
 * 글자는 textPath로 같은 경로를 따라 한 글자씩 놓입니다.
 * 위치는 아이콘과 같은 이동 거리 s 하나로 계산하므로 감속·정지·재출발·퇴장이 함께 움직입니다.
 */
function relationBlock(routeId) {
  const C = CONFIG, items = [];
  let x = 0;
  for (const [level, who] of ROUTE_RELATION_TEXT[routeId] || []) {
    if (items.length) x += C.REL_BAR_GAP;
    const len = C.REL_BAR_PAD_X * 2 + C.REL_ICON_SIZE + C.REL_ICON_TEXT_GAP +
      TEXT_WIDTH.relEn[who] + C.REL_WORD_GAP + TEXT_WIDTH.relKr[who];
    items.push({ level, en: who, kr: KR_NAMES[who], at: x, len });   // at: 읽는 방향 기준 시작 거리
    x += len;
  }
  return { items, width: x };
}

/* 노선 하나의 글자 방향: 모든 구간이 읽을 수 있는 방향이 되도록 노선 단위로 결정
   flipped = 이동 방향의 반대로 읽음 (왼쪽으로 향하는 노선) */
function routeFlipped(points, id) {
  let fwd = true, rev = true;
  for (let i = 0; i < points.length - 1; i++) {
    const a = Math.atan2(points[i + 1][1] - points[i][1], points[i + 1][0] - points[i][0]) * 180 / Math.PI;
    if (a > 90 + 1e-6 || a < -90 - 1e-6) fwd = false;
    if (Math.abs(a) < 90 - 1e-6) rev = false;
  }
  if (fwd) return false;
  if (rev) return true;
  throw new Error(id + ': 한 방향으로 읽을 수 있는 글자 방향이 없음');
}
function segOrientation(g, flipped) {
  const a = Math.atan2(g.y1 - g.y0, g.x1 - g.x0) * 180 / Math.PI;
  let rot = flipped ? a - 180 : a;
  if (rot <= -180) rot += 360;
  if (rot > 180) rot -= 360;
  return { rot, flipped };
}
const smooth = u => u * u * (3 - 2 * u);
function lerpAngle(a, b, t) {
  const d = ((b - a + 540) % 360) - 180;
  return a + d * t;
}
/** 아이콘 위치 s에서의 읽는 방향 (꺾임 이후 REL_TURN_BLEND 동안 보간) — 간격 계산용 */
function orientAt(route, s) {
  const i = segIndexAt(route.geo, s);
  const cur = route.orient[i];
  if (i > 0) {
    const B = route.blend[i];
    const u = B > 0 ? (s - route.geo.segs[i].s0) / B : 1;
    if (u < 1) return { rot: lerpAngle(route.orient[i - 1].rot, cur.rot, smooth(Math.max(0, u))), flipped: cur.flipped };
  }
  return { rot: cur.rot, flipped: cur.flipped };
}

/* ---- 가이드 경로: 선분 + 원호 ---- */
function buildGuide(points, side) {
  const k = CONFIG.REL_BAR_OFFSET, RG = CONFIG.REL_GUIDE_RADIUS;
  const n = points.length, dirs = [], lens = [];
  for (let j = 0; j < n - 1; j++) {
    const dx = points[j + 1][0] - points[j][0], dy = points[j + 1][1] - points[j][1];
    const L = Math.hypot(dx, dy);
    dirs.push({ x: dx / L, y: dy / L }); lens.push(L);
  }
  const nrm = d => ({ x: side * d.y, y: -side * d.x });   // 글자 윗면 쪽 법선
  // 평행 이동한 꺾은선의 꼭짓점
  const v = [];
  for (let i = 0; i < n; i++) {
    const [px, py] = points[i];
    if (i === 0 || i === n - 1) {
      const nn = nrm(dirs[i === 0 ? 0 : n - 2]);
      v.push({ x: px + nn.x * k, y: py + nn.y * k });
      continue;
    }
    const d1 = dirs[i - 1], d2 = dirs[i], n1 = nrm(d1), n2 = nrm(d2);
    const cr = d1.x * d2.y - d1.y * d2.x;
    if (Math.abs(cr) < 1e-9) { v.push({ x: px + n2.x * k, y: py + n2.y * k }); continue; }
    // (p + k n1) + t d1 = (p + k n2) + u d2
    const ax = k * (n2.x - n1.x), ay = k * (n2.y - n1.y);
    const t = (ax * d2.y - ay * d2.x) / cr;
    v.push({ x: px + n1.x * k + d1.x * t, y: py + n1.y * k + d1.y * t });
  }
  const glen = [];
  for (let j = 0; j < n - 1; j++) {
    const L = (v[j + 1].x - v[j].x) * dirs[j].x + (v[j + 1].y - v[j].y) * dirs[j].y;
    if (L <= 0) throw new Error('가이드 경로 구간이 뒤집힘');
    glen.push(L);
  }
  // 꺾임 둥글리기
  const T = new Array(n).fill(0), fil = new Array(n).fill(null);
  for (let i = 1; i < n - 1; i++) {
    const d1 = dirs[i - 1], d2 = dirs[i];
    const th = Math.acos(Math.max(-1, Math.min(1, d1.x * d2.x + d1.y * d2.y)));
    if (th < 1e-6) continue;
    const availPrev = glen[i - 1] * (i - 1 === 0 ? 1 : 0.5);
    const availNext = glen[i] * (i === n - 2 ? 1 : 0.5);
    const t = Math.min(RG * Math.tan(th / 2), availPrev, availNext);
    const r = t / Math.tan(th / 2);
    const left = d1.x * d2.y - d1.y * d2.x < 0;               // 화면 기준 왼쪽으로 꺾임
    const nc = left ? { x: d1.y, y: -d1.x } : { x: -d1.y, y: d1.x };
    const P1 = { x: v[i].x - d1.x * t, y: v[i].y - d1.y * t };
    const P2 = { x: v[i].x + d2.x * t, y: v[i].y + d2.y * t };
    const c = { x: P1.x + nc.x * r, y: P1.y + nc.y * r };
    T[i] = t;
    fil[i] = { P1, P2, c, r, th, sgn: left ? -1 : 1, a0: Math.atan2(P1.y - c.y, P1.x - c.x) };
  }
  // 선분·원호 목록
  const prims = [], virt = [];
  let acc = 0, cur = v[0];
  for (let j = 0; j < n - 1; j++) {
    const end = fil[j + 1] ? fil[j + 1].P1 : v[j + 1];
    virt.push(acc - T[j]);                                     // 이 구간의 (둥글리기 전) 시작 꼭짓점 위치
    const L = Math.hypot(end.x - cur.x, end.y - cur.y);
    prims.push({ type: 'L', a: cur, b: end, d: dirs[j], l0: acc, len: L });
    acc += L;
    if (fil[j + 1]) {
      const f = fil[j + 1], len = f.r * f.th;
      prims.push({ type: 'A', ...f, l0: acc, len });
      acc += len;
      cur = f.P2;
    } else cur = end;
  }
  function at(l) {
    let p = prims[0];
    if (l >= 0) for (const q of prims) { p = q; if (l <= q.l0 + q.len) break; }
    const t = l - p.l0;
    if (p.type === 'L') return { x: p.a.x + p.d.x * t, y: p.a.y + p.d.y * t, tx: p.d.x, ty: p.d.y };
    const ang = p.a0 + p.sgn * t / p.r;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    return { x: p.c.x + p.r * ca, y: p.c.y + p.r * sa, tx: -p.sgn * sa, ty: p.sgn * ca };
  }
  function pathD(reverse) {
    const f = q => q.x.toFixed(2) + ' ' + q.y.toFixed(2);
    const seq = reverse ? prims.slice().reverse() : prims;
    let d = 'M' + f(reverse ? seq[0].b || seq[0].P2 : prims[0].a);
    for (const p of seq) {
      if (p.type === 'L') d += ' L' + f(reverse ? p.a : p.b);
      else {
        const sweep = (p.sgn > 0) !== reverse ? 1 : 0;
        d += ` A${p.r.toFixed(2)} ${p.r.toFixed(2)} 0 0 ${sweep} ` + f(reverse ? p.P1 : p.P2);
      }
    }
    return d;
  }
  return { at, pathD, length: acc, virt, v, dirs, lens };
}

/* 기준 위치 ℓ*(s): 직선 구간에서 아이콘 바로 옆이 되는 가이드 위치 (구간마다 s + 상수).
 * 꺾임 안쪽 가이드는 노선보다 짧고 바깥쪽은 길어서 꺾임마다 계단처럼 바뀝니다. */
function buildNominal(points, guide) {
  const n = points.length, cs = [], sv = [0];
  for (let j = 0; j < n - 1; j++) sv.push(sv[j] + guide.lens[j]);
  for (let j = 0; j < n - 1; j++) {
    const d = guide.dirs[j];
    const dp = (points[j][0] - guide.v[j].x) * d.x + (points[j][1] - guide.v[j].y) * d.y;
    cs.push(guide.virt[j] + dp - sv[j]);
  }
  return s => {
    let j = 0;
    while (j < n - 2 && s >= sv[j + 1]) j++;
    return s + cs[j];
  };
}
/* 목표값 target 이하에 머물면서(아이콘·이름표를 침범하지 않음) 속도 비가
 * REL_SYNC_MIN_RATE ~ REL_SYNC_MAX_RATE 안에 있고 부드럽게 변하는 곡선을 만듭니다. */
function rateLimitedProfile(target, ds) {
  const N = target.length;
  const lo = CONFIG.REL_SYNC_MIN_RATE * ds, hi = CONFIG.REL_SYNC_MAX_RATE * ds;
  const R = Math.max(1, Math.round(CONFIG.REL_SYNC_SMOOTH / 2 / ds));
  function limitRates(arr) {
    for (let i = 1; i < N; i++) arr[i] = Math.min(arr[i], arr[i - 1] + hi);        // 따라잡는 속도 상한
    for (let i = N - 2; i >= 0; i--) arr[i] = Math.min(arr[i], arr[i + 1] - lo);   // 미리 늦춤 (속도 하한)
  }
  let cur = Float64Array.from(target);
  for (let pass = 0; pass < 6; pass++) {
    limitRates(cur);
    const out = new Float64Array(N), pre = new Float64Array(N + 1);
    for (let i = 0; i < N; i++) pre[i + 1] = pre[i] + cur[i];
    for (let i = 0; i < N; i++) {
      const a = Math.max(0, i - R), b = Math.min(N - 1, i + R);
      out[i] = Math.min(target[i], (pre[b + 1] - pre[a]) / (b - a + 1));
    }
    cur = out;
  }
  limitRates(cur);
  // 속도(기울기) 자체를 한 번 더 부드럽게: 속도를 이동 평균한 뒤 다시 적분하고,
  // 목표를 넘어선 만큼 전체를 뒤로 물려 겹침 방지 조건을 그대로 유지
  const Rv = Math.max(1, Math.round(CONFIG.REL_SYNC_SMOOTH / 4 / ds));
  const rate = new Float64Array(N - 1), pre = new Float64Array(N);
  for (let i = 0; i < N - 1; i++) rate[i] = cur[i + 1] - cur[i];
  for (let i = 0; i < N - 1; i++) pre[i + 1] = pre[i] + rate[i];
  const sm = new Float64Array(N);
  sm[0] = cur[0];
  for (let i = 0; i < N - 1; i++) {
    const a = Math.max(0, i - Rv), b = Math.min(N - 2, i + Rv);
    sm[i + 1] = sm[i] + (pre[b + 1] - pre[a]) / (b - a + 1);
  }
  let over = 0;
  for (let i = 0; i < N; i++) over = Math.max(over, sm[i] - target[i]);
  for (let i = 0; i < N; i++) cur[i] = sm[i] - over;
  return s => {
    const x = Math.max(0, Math.min(N - 1.000001, s / ds));
    const i = Math.floor(x), f = x - i;
    return cur[i] + (cur[i + 1] - cur[i]) * f;
  };
}

/* ---- 아이콘·이름표와 겹치지 않는 간격 (노선 방향) ---- */
function relCorners(rot, x0, width) {
  const k = CONFIG.REL_BAR_OFFSET, h = CONFIG.REL_BAR_H / 2;
  const y0 = -(k + h), y1 = -(k - h);
  const c = Math.cos(rot * Math.PI / 180), sn = Math.sin(rot * Math.PI / 180);
  return [[x0, y0], [x0 + width, y0], [x0 + width, y1], [x0, y1]]
    .map(([x, y]) => [x * c - y * sn, x * sn + y * c]);
}
function polyHitsRect(poly, r) {
  const rect = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
  const axes = [[1, 0], [0, 1]];
  for (let i = 0; i < poly.length; i++) {
    const [ax, ay] = poly[i], [bx, by] = poly[(i + 1) % poly.length];
    axes.push([-(by - ay), bx - ax]);
  }
  for (const [nx, ny] of axes) {
    let pmin = Infinity, pmax = -Infinity, rmin = Infinity, rmax = -Infinity;
    for (const [x, y] of poly) { const d = x * nx + y * ny; pmin = Math.min(pmin, d); pmax = Math.max(pmax, d); }
    for (const [x, y] of rect) { const d = x * nx + y * ny; rmin = Math.min(rmin, d); rmax = Math.max(rmax, d); }
    if (pmax <= rmin || rmax <= pmin) return false;
  }
  return true;
}
function relGap(route, rot, flipped) {
  const key = rot.toFixed(1);
  const hit = route.gapCache.get(key);
  if (hit !== undefined) return hit;
  const W = Math.min(route.rel.width, CONFIG.REL_NEAR_LEN), k = CONFIG.REL_CLEARANCE, R = CONFIG.ICON_OUTER_R;
  const ring = { x: -R - k, y: -R - k, w: 2 * (R + k), h: 2 * (R + k) };
  const lb = route.label;
  const label = { x: lb.x - k, y: lb.y - k, w: lb.w + 2 * k, h: lb.h + 2 * k };
  let g = CONFIG.REL_ALONG_GAP;
  for (; g < CONFIG.REL_ALONG_GAP + 200; g += 0.5) {
    const poly = relCorners(rot, flipped ? g : -g - W, W);
    if (!polyHitsRect(poly, ring) && !polyHitsRect(poly, label)) break;
  }
  if (route.gapCache.size > 5000) route.gapCache.clear();
  route.gapCache.set(key, g);
  return g;
}

/** 아이콘 위치 s에서의 관계 정보 바 형상 (모두 같은 s에서 계산) */
function relationBars(route, s) {
  const C = CONFIG, G = route.guide;
  if (!route.rel.items.length) return [];
  const front = route.front(s);                               // 아이콘 쪽 바 끝 (가이드 길이)
  const dir = route.flipped ? -1 : 1;                         // 읽는 방향이 가이드 길이에서 증가(+1)/감소(-1)
  const W = route.rel.width;
  const readStart = route.flipped ? front : front - W;        // 읽기 시작 지점
  const half = C.REL_BAR_H / 2 - C.REL_BAR_R;
  return route.rel.items.map(it => {
    const a = readStart + dir * it.at, b = a + dir * it.len;  // 읽는 방향 시작·끝
    const lo = Math.min(a, b) + C.REL_BAR_R, hi = Math.max(a, b) - C.REL_BAR_R;
    const steps = Math.max(1, Math.ceil((hi - lo) / C.REL_SAMPLE_STEP));
    const left = [], right = [];
    for (let i = 0; i <= steps; i++) {
      const q = G.at(lo + (hi - lo) * i / steps);
      left.push(q.x - q.ty * half, q.y + q.tx * half);
      right.push(q.x + q.ty * half, q.y - q.tx * half);
    }
    const pts = left;
    for (let i = right.length - 2; i >= 0; i -= 2) pts.push(right[i], right[i + 1]);
    const ic = G.at(a + dir * (C.REL_BAR_PAD_X + C.REL_ICON_SIZE / 2));
    const ang = Math.atan2(ic.ty * dir, ic.tx * dir) * 180 / Math.PI;
    const textAt = a + dir * (C.REL_BAR_PAD_X + C.REL_ICON_SIZE + C.REL_ICON_TEXT_GAP);
    return {
      pts, iconX: ic.x, iconY: ic.y, iconAng: ang,
      textOffset: route.flipped ? G.length - textAt : textAt,
    };
  });
}

/** 바 앞끝이 front일 때 실제로 휘어진 바가 원형 아이콘·이름표(원래 위치)를 침범하는지 */
function barHits(route, front, p) {
  const C = CONFIG, G = route.guide, k = C.REL_CLEARANCE, h = C.REL_BAR_H / 2;
  const R = C.ICON_OUTER_R + h + k, lb = route.label;
  const len = Math.min(route.rel.width, C.REL_NEAR_LEN);
  for (let l = front; l >= front - len; l -= C.REL_SAMPLE_STEP) {
    const q = G.at(l);
    const cx = q.x - p.x, cy = q.y - p.y;
    if (cx * cx + cy * cy < R * R) return true;
    for (const sgn of [-1, 0, 1]) {
      const x = cx - q.ty * h * sgn, y = cy + q.tx * h * sgn;
      if (x > lb.x - k && x < lb.x + lb.w + k && y > lb.y - k && y < lb.y + lb.h + k) return true;
    }
  }
  return false;
}
/** 아이콘 이동 거리 s → 바 앞끝 가이드 위치 (사전 계산 표)
 *  목표 = 아이콘 옆 기준 위치 − 실제 겹침을 피하는 데 필요한 간격 */
function buildFront(route, nominal) {
  const C = CONFIG, ds = 2, last = route.geo.length - 1;
  const N = Math.ceil(last / ds) + 1, target = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const s = Math.min(last, i * ds), p = pointAt(route.geo, s);
    const o = orientAt(route, s);
    const base = nominal(s + C.REL_GUIDE_EXTEND);
    let g = relGap(route, o.rot, o.flipped);
    while (g < 300 && barHits(route, base - g, p)) g += 1;
    target[i] = base - g;
  }
  return rateLimitedProfile(target, ds);
}

/** 아이콘 + 이름표 + 관계 정보 바 전체가 화면 밖으로 나간 이후의 거리 */
function computeExitS(route) {
  const geo = route.geo, R = CONFIG.ICON_OUTER_R, lb = route.label, pad = CONFIG.REL_BAR_R;
  const visible = s => {
    const p = pointAt(geo, s);
    let x0 = p.x + Math.min(-R, lb.x), x1 = p.x + Math.max(R, lb.x + lb.w);
    let y0 = p.y - R, y1 = p.y + lb.y + lb.h;
    for (const bar of relationBars(route, s)) {
      const q = bar.pts;
      for (let i = 0; i < q.length; i += 2) {
        x0 = Math.min(x0, q[i] - pad); x1 = Math.max(x1, q[i] + pad);
        y0 = Math.min(y0, q[i + 1] - pad); y1 = Math.max(y1, q[i + 1] + pad);
      }
    }
    return x1 > 0 && x0 < CONFIG.VIEW_W && y1 > 0 && y0 < CONFIG.VIEW_H;
  };
  for (let s = geo.length - 1; s >= 0; s -= 2) {
    if (visible(s)) return Math.min(geo.length - 1, s + 2);
  }
  return geo.length - 1;
}

/* ---------- 7. 경로 사전 계산 ---------- */
/** 마지막(화면 밖) 구간을 같은 방향으로 연장 — 긴 관계 정보 바까지 완전히 퇴장시키기 위함 */
function extendTail(points) {
  const pts = points.map(p => p.slice());
  const n = pts.length, [x0, y0] = pts[n - 2], [x1, y1] = pts[n - 1];
  const len = Math.hypot(x1 - x0, y1 - y0);
  pts[n - 1] = [x1 + (x1 - x0) / len * CONFIG.ROUTE_TAIL_EXTEND, y1 + (y1 - y0) / len * CONFIG.ROUTE_TAIL_EXTEND];
  return pts;
}
/** 가이드 경로 전용: 출발점 뒤쪽으로도 연장 (출발 직후 뒤따르는 바가 놓일 자리) */
function extendHead(points) {
  const pts = points.map(p => p.slice());
  const [x0, y0] = pts[0], [x1, y1] = pts[1];
  const len = Math.hypot(x1 - x0, y1 - y0);
  pts[0] = [x0 - (x1 - x0) / len * CONFIG.REL_GUIDE_EXTEND, y0 - (y1 - y0) / len * CONFIG.REL_GUIDE_EXTEND];
  return pts;
}
const ROUTE_DATA = ROUTES.map(r => {
  const tailPts = extendTail(r.points);
  const geo = buildGeometry(tailPts);
  const ch = CHAR_BY_ID[r.char];
  const stops = r.stops.map(id => {
    const pr = project(geo, INTERSECTIONS[id].x, INTERSECTIONS[id].y);
    if (pr.d > 0.5) throw new Error(`${r.id}: 교차점 ${id}가 경로 위에 없음 (${pr.d.toFixed(2)}px)`);
    return { id, s: pr.s };
  });
  for (let i = 1; i < stops.length; i++)
    if (stops[i].s <= stops[i - 1].s) throw new Error(`${r.id}: 정지 순서 오류`);
  const startDelay = (ch.no - 1) * CONFIG.START_INTERVAL + (r.order - 1) * CONFIG.SECOND_ROUTE_DELAY;
  const flipped = routeFlipped(r.points, r.id);
  const orient = geo.segs.map(g => segOrientation(g, flipped));
  const blend = geo.segs.map((g, i) => i === 0 ? 0
    : Math.min(CONFIG.REL_TURN_BLEND, g.len, geo.segs[i - 1].len));
  const guidePts = extendHead(tailPts);
  const guide = buildGuide(guidePts, flipped ? -1 : 1);
  const route = {
    ...r, geo, stops, startDelay, orient, blend, flipped, d: pathD(r.points),
    rel: relationBlock(r.id), label: labelBox(r.char), char: r.char,
    guide, guideD: guide.pathD(flipped), gapCache: new Map(),
  };
  route.front = route.rel.items.length ? buildFront(route, buildNominal(guidePts, guide)) : () => 0;
  route.exitS = computeExitS(route);
  return route;
});

/** 교차점별 통과 노선과 각 노선에서의 이동 거리 */
const INTERSECTION_DATA = Object.fromEntries(Object.entries(INTERSECTIONS).map(([id, pt]) => {
  const routes = ROUTE_DATA.filter(r => r.stops.some(s => s.id === id))
    .map(r => ({ route: r.id, char: r.char, distance: +r.stops.find(s => s.id === id).s.toFixed(2) }));
  return [id, { id, x: pt.x, y: pt.y, nx: pt.x / CONFIG.VIEW_W, ny: pt.y / CONFIG.VIEW_H, routes }];
}));

/* ---------- 8. 상호작용 모듈 (복합 교차점 처리 — 독립 교체 가능) ----------
 * - 각 아이콘은 진행 중인 상호작용 목록을 가짐 { level, start, end }
 * - 진행 중인 상호작용은 끝까지 유지 (중단·재시작 없음)
 * - 겹치는 상호작용은 테두리 불투명도를 max()로 합쳐 다시 깜빡이지 않음
 * - 색은 우선순위 낮은 순서로 겹쳐 칠해 나쁨 → 보통 → 안전 우선순위가 보이게 함
 * - 아이콘은 모든 상호작용의 end가 지나야 출발 가능
 */
const InteractionModule = {
  start(icons, level, t) {
    const end = t + CONFIG.INTERACTION_TOTAL;
    for (const ic of icons) {
      // 같은 등급이 이미 같은 시각에 시작됐다면 중복 기록하지 않음
      const dup = ic.interactions.find(x => x.level === level && Math.abs(x.start - t) < 1);
      if (!dup) ic.interactions.push({ level, start: t, end });
      ic.holdUntil = Math.max(ic.holdUntil, end);
    }
  },
  alpha(x, t) {
    const { INTERACTION_FADE_IN: fi, INTERACTION_FADE_OUT: fo } = CONFIG;
    if (t < x.start || t >= x.end) return 0;
    const a = Math.min(1, (t - x.start) / fi, (x.end - t) / fo);
    return a * a * (3 - 2 * a); // smoothstep — 부드러운 전환
  },
  /** 현재 테두리 색 (흰색 위에 관계색을 우선순위 순으로 합성) */
  ringColor(ic, t) {
    let rgb = hexToRgb(CONFIG.RING_DEFAULT);
    let maxA = 0, topLevel = null;
    const levels = Object.keys(LEVELS).sort((a, b) => LEVELS[a].priority - LEVELS[b].priority);
    for (const lv of levels) {
      let a = 0;
      for (const x of ic.interactions) if (x.level === lv) a = Math.max(a, this.alpha(x, t));
      if (a > 0) {
        rgb = mix(rgb, hexToRgb(LEVELS[lv].color), a);
        topLevel = lv; // 오름차순 순회 → 마지막이 가장 높은 우선순위
        maxA = Math.max(maxA, a);
      }
    }
    return { color: rgbToHex(rgb), level: topLevel, alpha: maxA };
  },
  prune(ic, t) {
    if (ic.interactions.length) ic.interactions = ic.interactions.filter(x => x.end > t);
  },
};
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(c) { return '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { return [0, 1, 2].map(i => a[i] + (b[i] - a[i]) * t); }

/* ---------- 9. 시뮬레이션 (이벤트 기반, 실제 경과 시간 기준) ----------
 * 노선 상태: WAIT_START(최초 출발 대기) → MOVING(이동) → STOPPED(교차점 정지/상호작용)
 *           → MOVING(이동 재개) → … → EXITED → RESPAWN_WAIT(2초) → MOVING …
 */
const PHASE = {
  WAIT_START: 'WAIT_START', MOVING: 'MOVING', STOPPED: 'STOPPED', RESPAWN_WAIT: 'RESPAWN_WAIT',
};

function createSimulation(hooks = {}) {
  const v = CONFIG.MOVE_SPEED / 1000; // px/ms
  let now = 0;
  const occupants = Object.fromEntries(Object.keys(INTERSECTIONS).map(k => [k, new Set()]));
  const icons = ROUTE_DATA.map(r => ({
    route: r, phase: PHASE.WAIT_START, wakeAt: r.startDelay,
    s0: 0, t0: 0, nextStop: 0, stop: null, holdUntil: 0, interactions: [], cycle: 0,
    label: { from: 0, to: 0, t0: 0, slot: 0 }, spawnedAt: null,
  }));
  const emit = (type, data) => hooks.onEvent && hooks.onEvent({ type, t: now, ...data });

  /* 이동 구간(leg) 계획: 공통 속도로 순항 → 교차점 도착 전 DECEL_DURATION 동안 ease-out 감속
   *  감속 거리 D = v·T/p 이므로 감속 시작 순간의 속도는 정확히 v (속도 끊김 없음),
   *  도착 순간 속도 0, s는 단조 증가 → 교차점을 지나치거나 뒤로 가지 않음.
   *  교차점이 감속 거리보다 가까우면 남은 거리 전체를 같은 곡선으로 감속.
   *  화면 밖 퇴장 구간(다음 교차점 없음)은 감속 없이 공통 속도 유지. */
  function planLeg(ic, t) {
    const r = ic.route;
    const toStop = ic.nextStop < r.stops.length;
    const target = toStop ? r.stops[ic.nextStop].s : r.exitS;
    const L = Math.max(0, target - ic.s0);
    const p = CONFIG.DECEL_POWER;
    const D = toStop ? Math.min(v * CONFIG.DECEL_DURATION / p, L) : 0;
    const Td = toStop ? p * D / v : 0;
    const tc = (L - D) / v;
    ic.leg = { s0: ic.s0, t0: t, L, D, tc, Td, arriveAt: t + tc + Td };
  }
  function legS(leg, t) {
    const tau = t - leg.t0;
    if (tau <= leg.tc) return leg.s0 + v * Math.max(0, tau);
    if (leg.Td <= 0) return leg.s0 + leg.L;
    const u = Math.min(1, (tau - leg.tc) / leg.Td);
    return leg.s0 + (leg.L - leg.D) + leg.D * (1 - Math.pow(1 - u, CONFIG.DECEL_POWER));
  }
  const sAt = (ic, t) => ic.phase === PHASE.MOVING ? legS(ic.leg, t) : ic.s0;
  const releaseTime = ic => Math.max(ic.stop.baseRelease, ic.holdUntil);

  /* ---- 교차점 이름표 세로 정렬 (표현 전용 — 이동·정지 시간에 영향 없음) ----
   * 정지 중인 아이콘을 도착 시각 → 캐릭터 번호 → 노선 번호 순으로 정렬해 슬롯을 매김.
   * 슬롯 0(먼저 도착)은 원래 위치, 이후 슬롯은 (이름표 높이 + 간격)만큼 아래.
   * 슬롯이 바뀌면 현재 위치에서 새 위치로 LABEL_SHIFT_MS 동안 부드럽게 이동.
   * 출발한 아이콘은 슬롯 0으로 복귀, 남은 아이콘은 빈칸 없이 재정렬. */
  const labelStep = CONFIG.NAME_LINE_HEIGHT + CONFIG.LABEL_PAD_Y * 2 + CONFIG.LABEL_STACK_GAP;
  const easeLabel = u => 1 - Math.pow(1 - u, 3);
  function labelDy(ic, t) {
    const L = ic.label;
    const u = Math.min(1, Math.max(0, (t - L.t0) / CONFIG.LABEL_SHIFT_MS));
    return L.from + (L.to - L.from) * easeLabel(u);
  }
  function setLabelSlot(ic, slot, t) {
    const to = slot * labelStep;
    if (ic.label.to === to) { ic.label.slot = slot; return; }
    ic.label = { from: labelDy(ic, t), to, t0: t, slot };
  }
  function restack(stopId, t) {
    const list = [...occupants[stopId]].sort((a, b) =>
      a.stop.arrivedAt - b.stop.arrivedAt ||
      CHAR_BY_ID[a.route.char].no - CHAR_BY_ID[b.route.char].no ||
      a.route.order - b.route.order);
    list.forEach((ic, i) => setLabelSlot(ic, i, t));
  }

  function nextEvent(ic) {
    switch (ic.phase) {
      case PHASE.WAIT_START:
      case PHASE.RESPAWN_WAIT: return ic.wakeAt;
      case PHASE.STOPPED: return releaseTime(ic);
      case PHASE.MOVING: return ic.leg.arriveAt;
    }
    return Infinity;
  }

  function arrive(ic, t, stop) {
    ic.phase = PHASE.STOPPED;
    ic.s0 = stop.s; ic.t0 = t;
    ic.stop = { id: stop.id, arrivedAt: t, baseRelease: t + CONFIG.INTERSECTION_WAIT };
    const occ = occupants[stop.id];
    // 이미 정지 중인 다른 캐릭터와 관계 판정
    const byLevel = {};
    for (const other of occ) {
      const lv = getRelation(ic.route.char, other.route.char);
      if (!lv) continue;
      (byLevel[lv] = byLevel[lv] || []).push(other);
    }
    occ.add(ic);
    restack(stop.id, t);
    emit('arrive', { route: ic.route.id, at: stop.id, with: [...occ].filter(o => o !== ic).map(o => o.route.id) });
    for (const [lv, others] of Object.entries(byLevel)) {
      InteractionModule.start([ic, ...others], lv, t);
      emit('interaction', { level: lv, at: stop.id, routes: [ic.route.id, ...others.map(o => o.route.id)] });
    }
  }

  function spawn(ic, t) {
    ic.phase = PHASE.MOVING; ic.s0 = 0; ic.t0 = t; ic.nextStop = 0; ic.stop = null;
    ic.holdUntil = 0; ic.interactions = []; ic.cycle++;
    ic.label = { from: 0, to: 0, t0: t, slot: 0 };
    ic.spawnedAt = t;                    // 페이드인 기준 시각 (재생성마다 0%부터 다시 시작)
    emit('spawn', { route: ic.route.id, cycle: ic.cycle });
    const st = ic.route.stops[0];
    if (st && st.s <= 1e-6) { ic.nextStop = 1; arrive(ic, t, st); }
    else planLeg(ic, t);
  }

  function processEvent(ic, t) {
    const r = ic.route;
    switch (ic.phase) {
      case PHASE.WAIT_START:
      case PHASE.RESPAWN_WAIT: spawn(ic, t); break;
      case PHASE.STOPPED: {
        occupants[ic.stop.id].delete(ic);
        setLabelSlot(ic, 0, t);          // 출발 → 원래 위치로 복귀
        restack(ic.stop.id, t);          // 남은 이름표 재정렬
        emit('release', { route: r.id, at: ic.stop.id, waited: t - ic.stop.arrivedAt });
        ic.phase = PHASE.MOVING; ic.t0 = t; ic.stop = null;
        planLeg(ic, t); // 대기 종료 → 공통 속도로 즉시 복귀
        break;
      }
      case PHASE.MOVING: {
        if (ic.nextStop < r.stops.length) {
          const st = r.stops[ic.nextStop++];
          arrive(ic, t, st);
        } else {
          ic.phase = PHASE.RESPAWN_WAIT; ic.s0 = r.exitS; ic.wakeAt = t + CONFIG.RESPAWN_DELAY;
          ic.interactions = [];
          emit('exit', { route: r.id });
        }
        break;
      }
    }
  }

  /** dt(ms)만큼 진행 — 이벤트를 시간 순서대로 처리하므로 프레임률과 무관 */
  function advance(dt) {
    const t1 = now + Math.max(0, Math.min(dt, CONFIG.MAX_FRAME_STEP));
    let guard = 0;
    for (;;) {
      let best = null, bt = Infinity;
      for (const ic of icons) { const te = nextEvent(ic); if (te < bt) { bt = te; best = ic; } }
      if (!best || bt > t1) break;
      now = Math.max(now, bt);
      processEvent(best, bt);
      if (++guard > 10000) break;
    }
    now = t1;
    for (const ic of icons) InteractionModule.prune(ic, now);
  }

  function snapshot() {
    return icons.map(ic => {
      const visible = ic.phase === PHASE.MOVING || ic.phase === PHASE.STOPPED;
      const s = sAt(ic, now);
      const p = pointAt(ic.route.geo, s);
      const ring = InteractionModule.ringColor(ic, now);
      const bars = visible ? relationBars(ic.route, s) : null;
      return {
        id: ic.route.id, char: ic.route.char, phase: ic.phase, visible,
        x: p.x, y: p.y, s, ring: ring.color, ringLevel: ring.level, ringAlpha: ring.alpha, bars,
        labelDy: labelDy(ic, now), labelSlot: ic.label.slot,
        // 등장 페이드인: 이동과 무관한 표현 값 (생성 후 경과 시간 / 500ms, 이후 1 유지)
        opacity: visible ? Math.min(1, Math.max(0, (now - ic.spawnedAt) / CONFIG.FADE_IN_DURATION)) : 0,
        decelerating: ic.phase === PHASE.MOVING && now - ic.leg.t0 > ic.leg.tc && ic.leg.Td > 0,
        stopAt: ic.stop ? ic.stop.id : null, arrivedAt: ic.stop ? ic.stop.arrivedAt : null,
        interacting: ic.holdUntil > now && !!ic.stop,
      };
    });
  }

  return {
    advance, snapshot, icons, occupants,
    get now() { return now; },
  };
}

const SubwayEngine = {
  CONFIG, CHARACTERS, CHAR_BY_ID, LEVELS, RELATIONS, getRelation,
  INTERSECTIONS, INTERSECTION_DATA, ROUTES: ROUTE_DATA, PHASE,
  ROUTE_RELATION_TEXT, KR_NAMES, TEXT_WIDTH,
  createSimulation, InteractionModule, pointAt, project, relationBars, orientAt,
};
if (typeof module !== 'undefined') module.exports = SubwayEngine;
if (typeof window !== 'undefined') window.SubwayEngine = SubwayEngine;

</script>
<script>
/* =====================================================================
 * 지하철 생태 아카이브 — React 화면
 * 레이어 1: 배경 / 레이어 2: 노선도 (이미지 ① 원본 그대로, 고정)
 * 레이어 3: 캐릭터 아이콘 + 이름 (requestAnimationFrame으로 직접 갱신)
 * ===================================================================== */
(function () {
  const { createElement: h, useEffect, useRef, useState, memo } = React;
  const E = window.SubwayEngine;
  const C = E.CONFIG;
  const MAP_SRC = window.__SUBWAY_MAP_SRC__;
  const LEGEND_SRC = window.__SUBWAY_LEGEND_SRC__;
  const LEGEND = { x: 18, y: 18, w: 183, h: 83 }; // 수정 디자인 기준 위치 · 원본 SVG 크기
  // 이름표 상자 안 텍스트 기준선 (상자 위 여백 2px + Inter 20px / line-height 24)
  const NAME_BASELINE = C.ICON_OUTER_R + C.ICON_NAME_GAP + C.LABEL_PAD_Y +
    (C.NAME_LINE_HEIGHT - C.NAME_FONT_SIZE * 1.21) / 2 + C.NAME_FONT_SIZE * 0.969;
  const REL_ICON_ID = { BAD: 'rel-danger', NORMAL: 'rel-caution', SAFE: 'rel-safety' };

  /* 단일 시뮬레이션 인스턴스 (접속 즉시 자동 시작) */
  const sim = E.createSimulation();
  window.__subwaySim = sim;

  function Defs() {
    return h('defs', null,
      h('clipPath', { id: 'frame' }, h('rect', { x: 0, y: 0, width: C.VIEW_W, height: C.VIEW_H })),
      // 이름표 그림자: box-shadow 0 0 2px rgba(43,43,43,.2)
      h('filter', { id: 'label-shadow', x: '-20%', y: '-40%', width: '140%', height: '180%' },
        h('feDropShadow', {
          dx: 0, dy: 0, stdDeviation: C.LABEL_SHADOW_BLUR / 2,
          floodColor: '#2B2B2B', floodOpacity: 0.2,
        })),
      E.CHARACTERS.map(ch => h('linearGradient', {
        key: ch.id, id: 'fill-' + ch.id, x1: 0, y1: 0, x2: 1, y2: 1,
      },
        h('stop', { offset: '0%', stopColor: ch.fill[0] }),
        h('stop', { offset: '100%', stopColor: ch.fill[1] }))));
  }

  /* 레이어 1+2 — 원본 노선도 (정적) */
  const MapLayer = memo(function MapLayer() {
    return h('image', {
      href: MAP_SRC, x: 0, y: 0, width: C.VIEW_W, height: C.VIEW_H,
      preserveAspectRatio: 'none', className: 'map',
    });
  });

  /* 레이어 3 — 아이콘과 이름을 하나의 그룹으로 */
  const IconLayer = memo(function IconLayer() {
    const rootRef = useRef(null);
    useEffect(() => {
      const layer = rootRef.current.querySelector('.icons');
      const relLayer = rootRef.current.querySelector('.rels');
      const nodes = {};
      for (const r of E.ROUTES) {
        const g = layer.querySelector(`[data-route="${r.id}"]`);
        const rel = relLayer.querySelector(`[data-rel="${r.id}"]`);
        nodes[r.id] = {
          g, ring: g.querySelector('.ring'), label: g.querySelector('.label'), rel,
          bars: rel ? [...rel.querySelectorAll('.rel-item')].map(it => ({
            poly: it.querySelector('polygon'), icon: it.querySelector('use'), tp: it.querySelector('textPath'),
          })) : [],
          lastVis: null, lastRing: null, lastDy: null, lastOp: null,
        };
      }
      const ptsStr = (a) => {
        let out = '';
        for (let i = 0; i < a.length; i += 2) out += (i ? ' ' : '') + a[i].toFixed(1) + ',' + a[i + 1].toFixed(1);
        return out;
      };
      let raf = 0, last = performance.now(), lastOrder = '';
      const frame = (ts) => {
        sim.advance(ts - last);
        last = ts;
        const snap = sim.snapshot();
        for (const s of snap) {
          const n = nodes[s.id];
          if (n.lastVis !== s.visible) {
            const d = s.visible ? '' : 'none';
            n.g.style.display = d; if (n.rel) n.rel.style.display = d;
            n.lastVis = s.visible;
          }
          if (!s.visible) continue;
          // 등장 페이드인: 아이콘·이름표 그룹과 관계 바 그룹에 같은 시각의 같은 불투명도
          const op = s.opacity >= 1 ? '1' : s.opacity.toFixed(3);
          if (op !== n.lastOp) { n.g.setAttribute('opacity', op); if (n.rel) n.rel.setAttribute('opacity', op); n.lastOp = op; }
          n.g.setAttribute('transform', `translate(${s.x.toFixed(2)} ${s.y.toFixed(2)})`);
          if (n.lastRing !== s.ring) { n.ring.setAttribute('fill', s.ring); n.lastRing = s.ring; }
          // 이름표: 교차점 도착 순서에 따른 세로 정렬 오프셋 (원형 아이콘은 그대로)
          const dy = s.labelDy.toFixed(2);
          if (dy !== n.lastDy) { n.label.setAttribute('transform', `translate(0 ${dy})`); n.lastDy = dy; }
          // 관계 정보 바: 아이콘과 같은 스냅샷(같은 s)에서 계산된 휘어진 형상
          if (s.bars) s.bars.forEach((b, i) => {
            const el = n.bars[i];
            el.poly.setAttribute('points', ptsStr(b.pts));
            el.icon.setAttribute('transform', `translate(${b.iconX.toFixed(2)} ${b.iconY.toFixed(2)}) rotate(${b.iconAng.toFixed(2)})`);
            el.tp.setAttribute('startOffset', b.textOffset.toFixed(2));
          });
        }
        // 겹침 순서: 정지 아이콘은 먼저 도착한 순서대로 아래, 이동 중인 아이콘은 위
        const order = snap.filter(s => s.visible)
          .sort((a, b) => (a.stopAt ? a.arrivedAt : 1e15) - (b.stopAt ? b.arrivedAt : 1e15))
          .map(s => s.id);
        const key = order.join(',');
        if (key !== lastOrder) { for (const id of order) layer.appendChild(nodes[id].g); lastOrder = key; }
        raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame((ts) => { last = ts; frame(ts); });
      return () => cancelAnimationFrame(raf);
    }, []);

    // 관계 정보 레이어를 아이콘 레이어 아래에 두어, 다른 캐릭터의 아이콘·이름표를 가리지 않게 함
    return h('g', { ref: rootRef },
      h('g', { className: 'rels' },
        h('defs', null, E.ROUTES.map(r => h('path', { key: r.id, id: 'guide-' + r.id, d: r.guideD }))),
        E.ROUTES.map(r => h(RelationBars, { key: r.id, route: r }))),
      h('g', { className: 'icons' },
      E.ROUTES.map(r => h('g', { key: r.id, 'data-route': r.id, style: { display: 'none' } },
        h('circle', { className: 'ring', r: C.ICON_OUTER_R, fill: C.RING_DEFAULT }),
        h('circle', { r: C.ICON_FILL_R, fill: `url(#fill-${r.char})` }),
        h('g', { className: 'label' },
          h('rect', {
            className: 'label-bg', x: r.label.x, y: r.label.y, width: r.label.w, height: r.label.h,
            rx: C.LABEL_RADIUS, ry: C.LABEL_RADIUS, fill: C.LABEL_BG, filter: 'url(#label-shadow)',
          }),
          h('text', {
            className: 'name', y: NAME_BASELINE, textAnchor: 'middle',
            style: { fontSize: C.NAME_FONT_SIZE + 'px' },
          }, r.char))))));
  });

  /* 노선별 관계 정보 바 — 항목마다 독립된 흰색 반투명 바 + 관계 SVG + 영문(SemiBold) + 한글(Regular)
     바: 가이드 경로 구간을 따라 만든 띠(둥근 이음 stroke로 6px 모서리), 90% 흰색, 미세한 그림자
     글자: 같은 가이드 경로의 textPath (글자마다 접선 방향), 아이콘: 위치·회전만 변경 */
  function RelationBars({ route }) {
    if (!route.rel.items.length) return null;
    return h('g', { className: 'rel', 'data-rel': route.id, style: { display: 'none' } },
      route.rel.items.map((it, i) => h('g', { key: i, className: 'rel-item' },
        h('g', { filter: 'url(#label-shadow)' },
          h('g', { opacity: 0.9 },
            h('polygon', {
              fill: '#FFFFFF', stroke: '#FFFFFF', strokeWidth: C.REL_BAR_R * 2, strokeLinejoin: 'round',
            }))),
        h('use', {
          href: '#' + REL_ICON_ID[it.level],
          x: -C.REL_ICON_SIZE / 2, y: -C.REL_ICON_SIZE / 2, width: C.REL_ICON_SIZE, height: C.REL_ICON_SIZE,
        }),
        h('text', null,
          h('textPath', { href: '#guide-' + route.id },
            h('tspan', { className: 'rel-en', dy: C.REL_BASELINE_SHIFT }, it.en),
            h('tspan', { className: 'rel-kr', dx: C.REL_WORD_GAP }, it.kr))))));
  }

  /* 좌측 상단 관계도 범례 — 첨부 Risk Level bar.svg 원본 그대로, 최상위 고정 레이어 */
  function Legend() {
    return h('image', {
      href: LEGEND_SRC, x: LEGEND.x, y: LEGEND.y, width: LEGEND.w, height: LEGEND.h,
      className: 'legend',
    });
  }

  /* 개발 확인용 오버레이 — 기본 숨김, 키보드 D로 켜고 끔 (최종 화면에는 표시되지 않음) */
  function DebugLayer() {
    const [, force] = useState(0);
    useEffect(() => { const id = setInterval(() => force(x => x + 1), 200); return () => clearInterval(id); }, []);
    const occ = sim.occupants;
    return h('g', { className: 'debug' },
      E.ROUTES.map(r => h('path', {
        key: r.id, d: r.d, fill: 'none', stroke: E.CHAR_BY_ID[r.char].fill[0],
        strokeWidth: 3, strokeDasharray: '10 6', opacity: 0.9,
      })),
      Object.values(E.INTERSECTION_DATA).map(p => h('g', { key: p.id, transform: `translate(${p.x} ${p.y})` },
        h('circle', { r: 9, fill: 'none', stroke: '#d4002a', strokeWidth: 3 }),
        h('text', { x: 14, y: -12, className: 'dbg-text' },
          `${p.id} ${[...occ[p.id]].map(o => o.route.id).join(' ')}`))),
      h('text', { x: 24, y: 1056, className: 'dbg-text' },
        `t=${(sim.now / 1000).toFixed(1)}s  ` + sim.icons.map(i => `${i.route.id}:${i.phase[0]}${i.stop ? '@' + i.stop.id : ''}`).join(' ')));
  }

  function App() {
    const [debug, setDebug] = useState(false);
    useEffect(() => {
      const onKey = (e) => { if (e.key === 'd' || e.key === 'D') setDebug(v => !v); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);
    return h('svg', {
      className: 'stage', viewBox: `0 0 ${C.VIEW_W} ${C.VIEW_H}`,
      preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': '지하철 생태 아카이브 노선도',
    },
      h(Defs),
      h('g', { clipPath: 'url(#frame)' },
        h('rect', { width: C.VIEW_W, height: C.VIEW_H, fill: '#FBFBFB' }),
        h(MapLayer),
        debug ? h(DebugLayer) : null,
        h(IconLayer),
        h(Legend)));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();

<script>
/* =====================================================================
 * 지하철 생태 아카이브 — 검지 회전 제스처 인식 (영상 팝업 종료용)
 *
 * MediaPipe Gesture Recognizer가 주는 손 랜드마크(21점)만 사용합니다. 별도 모델 학습 없음.
 *  1) 자세: 검지만 편 상태 — 분류 결과 'Pointing_Up' 또는 랜드마크 판정(검지 펴짐 + 중지·약지·새끼 접힘)
 *  2) 움직임: 검지 끝(8번)의 이동 경로가 한 방향으로 약 330° 이상 회전
 *     - 손 크기(손목 0 ↔ 중지 뿌리 9 거리)로 정규화 → 카메라 거리와 무관
 *     - 경로를 주축 기준으로 정규화(타원 → 원)해 각도를 계산 → 비스듬히 본 원(납작한 타원)도 인식
 *     - 짧은 축이 너무 작으면(일직선 움직임) 회전으로 보지 않음
 *  손마다 따로 추적하므로 왼손·오른손, 시계·반시계, 거울 모드 여부와 관계없이 같은 기준으로 판정합니다.
 * ===================================================================== */
(function (root) {
  const ROTATION_DEFAULTS = {
    // 자세 판정
    POINTING_MIN_SCORE: 0.5,   // 'Pointing_Up' 분류 신뢰도 하한
    IDX_EXT_MIN: 1.4,          // 검지 펴짐: |끝-손목| / |뿌리-손목| (참고 영상: 편 상태 1.7~2.0, 주먹 0.8)
    IDX_STRAIGHT_MIN: 0.85,    // 검지 곧음: 뿌리→끝 직선거리 / 마디 길이 합 (편 상태 ≈1.0, 주먹 ≈0.3)
    OTHER_FOLD_MAX: 1.15,      // 중지·약지·새끼 접힘: |끝-손목| / |뿌리-손목| (참고 영상 0.5~0.8, 편 손 ≈1.9)
    POSE_STABLE_MS: 200,       // 검지 자세가 이 시간 이상 이어진 뒤부터 회전 기록
    POSE_GRACE_MS: 250,        // 회전 중 자세 인식이 잠깐 흔들려도 이 시간까지는 기록 유지
    HAND_LOST_MS: 300,         // 손이 이 시간 동안 안 보이면 기록 초기화

    // 회전 판정
    TARGET_DEG: 330,           // 한 방향 누적 회전 각도
    MIN_TURN_MS: 400,          // 한 바퀴에 걸린 시간 하한 (참고 영상 한 바퀴 ≈ 0.65초)
    MAX_TURN_MS: 2500,         // 한 바퀴에 걸린 시간 상한
    WINDOW_MS: 2500,           // 경로 분석 구간
    STATS_MS: 1200,            // 회전 중심·주축 계산에 쓰는 최근 구간 (참고 영상 기준: 시작 후 약 1초 안에 인식)
    DIR_CONSISTENCY: 0.8,      // 반대 방향 회전 비율 허용치 (한 방향 각도 / 전체 각도)
    MIN_RADIUS: 0.15,          // 평균 회전 반경 하한 (손 크기 단위) — 작은 원도 인식
    MIN_MINOR: 0.06,           // 경로의 짧은 축 표준편차 하한 (손 크기 단위) — 일직선 움직임 제외
    MAX_AXIS_RATIO: 8,         // 긴 축 / 짧은 축 상한
    MIN_STEP: 0.008,           // 이보다 작은 이동은 떨림으로 보고 무시 (손 크기 단위)
    STILL_SPEED: 0.3,          // 손 크기/초 — 이보다 느린 상태가
    STILL_MS: 600,             //            이 시간 이어지면 회전 중단으로 보고 기록 초기화
    SCALE_SMOOTH: 0.2,         // 손 크기 평활
  };

  const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  /** 랜드마크(픽셀 좌표 배열 [[x,y]…21])로 검지 자세 판정 */
  function pointingPose(P, cfg) {
    const w = P[0];
    const ext = (tip, mcp) => d2(P[tip], w) / Math.max(1e-6, d2(P[mcp], w));
    const idx = ext(8, 5);
    const straight = d2(P[5], P[8]) / Math.max(1e-6, d2(P[5], P[6]) + d2(P[6], P[7]) + d2(P[7], P[8]));
    const mid = ext(12, 9), ring = ext(16, 13), pinky = ext(20, 17);
    const ok = idx >= cfg.IDX_EXT_MIN && straight >= cfg.IDX_STRAIGHT_MIN &&
      mid <= cfg.OTHER_FOLD_MAX && ring <= cfg.OTHER_FOLD_MAX && pinky <= cfg.OTHER_FOLD_MAX;
    return { ok, idx, straight, mid, ring, pinky };
  }

  function createRotationTracker(overrides) {
    const cfg = Object.assign({}, ROTATION_DEFAULTS, overrides || {});
    let samples = [];            // {t, x, y} — 손 크기 단위
    let scale = 0, poseSince = -1, lastPoseAt = -1e9, lastSeen = -1e9, lastMoveAt = -1e9, lastDeg = 0;

    function reset(keepPose) {
      samples = []; lastDeg = 0;
      if (!keepPose) { poseSince = -1; lastPoseAt = -1e9; }
    }

    /** 경로 분석: 조건을 만족하면 {deg, dir, ms} 반환, 아니면 진행 각도만 */
    function analyse(now) {
      const n = samples.length;
      if (n < 6) return { deg: 0 };
      // 중심·주축은 최근 STATS_MS 구간으로 계산 (회전 시작 전 손을 옮기던 움직임의 영향 배제)
      let k0 = 0;
      while (k0 < n - 6 && now - samples[k0].t > cfg.STATS_MS) k0++;
      const m = n - k0;
      let cx = 0, cy = 0;
      for (let k = k0; k < n; k++) { cx += samples[k].x; cy += samples[k].y; }
      cx /= m; cy /= m;
      let sxx = 0, syy = 0, sxy = 0;
      for (let k = k0; k < n; k++) { const dx = samples[k].x - cx, dy = samples[k].y - cy; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
      sxx /= m; syy /= m; sxy /= m;
      // 공분산 고유값 분해 → 주축
      const tr = sxx + syy, det = sxx * syy - sxy * sxy;
      const disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
      const l1 = tr / 2 + disc, l2 = Math.max(0, tr / 2 - disc);
      const major = Math.sqrt(l1), minor = Math.sqrt(l2);
      if (minor < cfg.MIN_MINOR || major / Math.max(minor, 1e-6) > cfg.MAX_AXIS_RATIO) return { deg: 0 };
      let ex = 1, ey = 0;
      if (Math.abs(sxy) > 1e-12) { ex = l1 - syy; ey = sxy; const L = Math.hypot(ex, ey); ex /= L; ey /= L; }
      else if (syy > sxx) { ex = 0; ey = 1; }
      // 정규화 좌표(타원 → 원)에서의 각도
      const ang = samples.map(s => {
        const dx = s.x - cx, dy = s.y - cy;
        const u = (dx * ex + dy * ey) / major, v = (-dx * ey + dy * ex) / minor;
        return Math.atan2(v, u);
      });
      // 가장 최근부터 거슬러 올라가며 누적 → 목표 각도에 처음 도달하는 구간 찾기
      let sum = 0, pos = 0, neg = 0, rsum = 0, best = 0;
      const target = cfg.TARGET_DEG * Math.PI / 180;
      for (let i = n - 1; i > 0; i--) {
        let da = ang[i] - ang[i - 1];
        if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
        sum += da; if (da > 0) pos += da; else neg -= da;
        rsum += Math.hypot(samples[i].x - cx, samples[i].y - cy);
        best = Math.max(best, Math.abs(sum));
        if (Math.abs(sum) >= target) {
          const ms = now - samples[i - 1].t;
          const consistency = Math.abs(sum) / Math.max(1e-6, pos + neg);
          const radius = rsum / (n - i);
          const ok = ms >= cfg.MIN_TURN_MS && ms <= cfg.MAX_TURN_MS &&
            consistency >= cfg.DIR_CONSISTENCY && radius >= cfg.MIN_RADIUS;
          if (ok) return { deg: Math.abs(sum) * 180 / Math.PI, dir: sum > 0 ? 1 : -1, ms, fire: true, radius, consistency };
          break;
        }
      }
      return { deg: best * 180 / Math.PI };
    }

    /**
     * 한 프레임 입력. lm: 픽셀 좌표 랜드마크 [[x,y]…21] (없으면 null = 손 없음)
     * gesture/score: 이 손의 분류 결과. 반환: { pointing, deg, fired, info }
     */
    function update(t, lm, gesture, score) {
      if (!lm) {
        if (t - lastSeen > cfg.HAND_LOST_MS) reset(false);
        return { pointing: false, deg: 0, fired: false };
      }
      lastSeen = t;
      const pose = pointingPose(lm, cfg);
      const byClass = gesture === 'Pointing_Up' && score >= cfg.POINTING_MIN_SCORE;
      const pointingNow = pose.ok || byClass;
      if (pointingNow) {
        if (poseSince < 0) poseSince = t;
        lastPoseAt = t;
      } else if (t - lastPoseAt > cfg.POSE_GRACE_MS) {
        reset(false);
        return { pointing: false, pointingNow: false, deg: 0, fired: false, pose };
      }
      const pointing = pointingNow || t - lastPoseAt <= cfg.POSE_GRACE_MS;
      if (poseSince < 0 || t - poseSince < cfg.POSE_STABLE_MS) return { pointing, pointingNow, deg: 0, fired: false, pose };
      // 자세 인식이 잠깐 흔들린 프레임: 기록은 유지하되 그 프레임의 좌표는 쓰지 않음 (잘못된 손가락 위치 배제)
      if (!pointingNow) return { pointing, pointingNow, deg: lastDeg, fired: false, pose };

      // 손 크기 (평활) 와 검지 끝 위치 (손 크기 단위)
      const s = d2(lm[0], lm[9]);
      scale = scale ? scale + (s - scale) * cfg.SCALE_SMOOTH : s;
      const x = lm[8][0] / scale, y = lm[8][1] / scale;
      const last = samples[samples.length - 1];
      if (last) {
        const step = Math.hypot(x - last.x, y - last.y);
        const speed = step / Math.max(1e-3, (t - last.t) / 1000);
        if (speed >= cfg.STILL_SPEED) lastMoveAt = t;
        else if (t - lastMoveAt > cfg.STILL_MS) { samples = []; lastMoveAt = t; }
        if (step < cfg.MIN_STEP) return { pointing, pointingNow, deg: lastDeg, fired: false, pose };
      } else lastMoveAt = t;
      samples.push({ t, x, y });
      while (samples.length && t - samples[0].t > cfg.WINDOW_MS) samples.shift();
      const a = analyse(t);
      lastDeg = a.deg;
      if (a.fire) { samples = []; lastDeg = 0; return { pointing, pointingNow, deg: a.deg, fired: true, info: a, pose }; }
      return { pointing, pointingNow, deg: a.deg, fired: false, pose };
    }

    return { update, reset: () => reset(false), cfg };
  }

  const api = { createRotationTracker, pointingPose, ROTATION_DEFAULTS };
  if (typeof module !== 'undefined') module.exports = api;
  else root.SubwayRotation = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

 *
 * 기존 노선 인터랙티브(engine.js / app.js)는 그대로 두고, 그 위에 오버레이 레이어만 추가합니다.

(function () {

    VIDEOS: {
      CHIGO:   'https://gongmm26.github.io/subway-ecology-archive/video/01_CHIGO.mp4',
      PACKGU:  'https://gongmm26.github.io/subway-ecology-archive/video/02_PACKGU.mp4',

      SCROLLA: 'https://gongmm26.github.io/subway-ecology-archive/video/07_SCROLLA.mp4',
      KKIRU:   'https://gongmm26.github.io/subway-ecology-archive/video/08_KKIRU.mp4',
      JJEOKGU: 'https://gongmm26.github.io/subway-ecology-archive/video/09_JJEOKGU.mp4',
    },

    // 잡을 수 있는 교차지점 → 캐릭터 (Image D의 번호 1~9가 붙은 교차지점)
    TARGETS: {
      D: 'CHIGO',    // 1
      E: 'PACKGU',   // 2
      K: 'BEOTI',    // 3
      H: 'SUHO',     // 4
      B: 'MAMSHA',   // 5

    // 팝업 위치: Image D 번호 위치에 카드 중심을 맞춘 뒤 안전 영역 안으로 맞춤.
    // 값은 Figma 프레임(820×535, 중앙 정렬 20px 테두리) 좌상단. 실제 보이는 카드 = 프레임 ±10px.
    POPUP_ANCHORS: {           // Image D 번호 중심 (측정값)
      CHIGO: [394, 394], PACKGU: [1210, 386], BEOTI: [1223, 826], SUHO: [683, 842], MAMSHA: [1438, 163],
      SUDAJO: [848, 677], SCROLLA: [1582, 682], KKIRU: [1460, 512], JJEOKGU: [416, 705],
    },
    POPUP_OVERRIDE: { CHIGO: [90, 143] },   // Image E Figma 값 그대로
    // 팝업 크기: 영상 표시 높이(515px)는 그대로, 너비 = 영상 표시 너비(515 × 4/3) → 사방 여백 20px로 균일
    VIDEO_H: 515,              // px — 영상 표시 높이 (기존과 동일)

    FALLBACK_SHOW_MS: 3500,    // ms — 영상 실패 안내 표시 시간

    // 손동작
    MP_VERSION: '0.10.14',
    MODEL_URL: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',
    MIN_SCORE: 0.55,           // 제스처 신뢰도 하한
    OPEN_FRAMES: 3,            // 잡기 준비: Open_Palm 연속 프레임
    FIST_FRAMES: 2,            // 잡기 확정: Closed_Fist 연속 프레임
    GRAB_WINDOW_MS: 800,       // 마지막 Open_Palm 이후 이 시간 안에 쥐어야 잡기로 인정
    HAND_LOST_MS: 350,         // 손이 이 시간 동안 안 보이면 커서 숨김
    CAMERA_MARGIN: 0.12,       // 카메라 화면 가장자리 12%는 버리고 안쪽을 화면 전체에 대응
    CURSOR_SMOOTH: 0.35,       // 커서 위치 지수 평활 (0~1, 클수록 즉각 반응)
    MOUSE_FALLBACK: true,      // 카메라가 없을 때 마우스로 테스트
    SHOW_HOVER_RING: true,     // 커서가 선택 범위 안일 때 교차지점 둘레에 원 표시 (false = 커서만)

    // 검지 회전으로 영상 닫기 — 세부 판정값은 rotation.js 상단 ROTATION_DEFAULTS, 여기서 덮어쓰기 가능
    NUM_HANDS: 2,              // 동시에 추적하는 손 수 (손마다 회전 기록을 따로 관리)
    ROTATION: {},              // 예: { TARGET_DEG: 300, MIN_RADIUS: 0.12 }
    MOUSE_ROTATE_SCALE: 60,    // 마우스 테스트: 오른쪽 버튼으로 그리는 원을 손 크기 60px 기준으로 판정
  };

  /* ---------- 팝업 크기 · 프레임 위치 계산 ---------- */
  const VIDEO_W = Math.round(CFG.VIDEO_H * CFG.VIDEO_ASPECT);   // 687px (4:3)
  CFG.FRAME_W = VIDEO_W + CFG.STROKE;                            // Figma 프레임 기준(중앙 정렬 테두리) 707
  CFG.FRAME_H = CFG.VIDEO_H + CFG.STROKE;                        // 535 (기존과 동일)
  const CARD_W = VIDEO_W + CFG.STROKE * 2, CARD_H = CFG.VIDEO_H + CFG.STROKE * 2;   // 보이는 카드 727 × 555
  const FRAMES = {};
  for (const ch of Object.keys(CFG.VIDEOS)) {
    let x, y;
    if (CFG.POPUP_OVERRIDE[ch]) [x, y] = CFG.POPUP_OVERRIDE[ch];
    else {
      const [ax, ay] = CFG.POPUP_ANCHORS[ch];
      x = Math.round(ax - CFG.FRAME_W / 2); y = Math.round(ay - CFG.FRAME_H / 2);
    }
    const half = CFG.STROKE / 2, S = CFG.SAFE;
    x = Math.min(Math.max(x, S.x0 + half), S.x1 - half - CFG.FRAME_W);
    y = Math.min(Math.max(y, S.y0 + half), S.y1 - half - CFG.FRAME_H);
    FRAMES[ch] = { x, y };
  }
  const TARGET_LIST = Object.entries(CFG.TARGETS).map(([id, ch]) => ({ id, ch, x: E.INTERSECTIONS[id].x, y: E.INTERSECTIONS[id].y }));

  /* ---------- 오버레이 DOM ---------- */
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const layer = document.createElement('div');
  layer.className = 'ov-scale';
  layer.innerHTML = `
    <div class="ov-hover" aria-hidden="true"></div>
    <div class="ov-popups"></div>
    <div class="ov-cursor" aria-hidden="true"></div>`;
  overlay.appendChild(layer);
  const $ = sel => layer.querySelector(sel);
  const hoverEl = $('.ov-hover'), popupsEl = $('.ov-popups'), cursorEl = $('.ov-cursor');
  // 카메라 입력용 video: 화면에는 보이지 않지만 스트림·프레임 처리는 계속되도록
  // display:none 대신 뷰포트 안 2×2px, opacity 0, 가장 뒤 레이어에 둠 (전시 화면에 아무것도 보이지 않음)
  const camEl = document.createElement('video');
  camEl.className = 'ov-cam-hidden';
  camEl.muted = true; camEl.playsInline = true;
  camEl.setAttribute('muted', ''); camEl.setAttribute('playsinline', ''); camEl.setAttribute('aria-hidden', 'true');
  document.body.appendChild(camEl);
  // 상태 값은 화면에 표시하지 않고 내부에만 보관 (개발 확인용: window.__subwayGesture.status, 브라우저 콘솔)
  const status = { input: '준비 중', hand: '—', gesture: '—', target: '—', playing: '대기', rotation: '—' };
  const setStatus = (k, v) => {
    if (status[k] === v) return;
    status[k] = v;
    if (k === 'input' || k === 'playing') console.info('[subway]', k, v);
  };

  // 16:9 무대 크기에 맞춰 1920×1080 오버레이를 같은 배율로 축소
  let scale = 1;
  const fit = () => {
    const r = stage.getBoundingClientRect();
    scale = r.width / CFG.VIEW_W;
    layer.style.transform = `scale(${scale})`;
  };
  fit();
  (window.ResizeObserver ? new ResizeObserver(fit).observe(stage) : window.addEventListener('resize', fit));


  /* ---------- 영상 팝업 (한 번에 하나) ---------- */
  const Popup = {
    active: null,        // { ch, el, video, timers[] }
    closedAt: -1e9,
    busy() { return !!this.active || performance.now() - this.closedAt < CFG.COOLDOWN_MS; },

    open(ch) {
      if (this.busy()) return false;
      const f = FRAMES[ch], kr = E.KR_NAMES[ch] || '';
      const el = document.createElement('div');
      el.className = 'ov-card';
      el.style.width = CARD_W + 'px'; el.style.height = CARD_H + 'px';
      el.style.left = (f.x - CFG.STROKE / 2) + 'px';
      el.style.top = (f.y - CFG.STROKE / 2) + 'px';
      el.style.transitionDuration = CFG.POPUP_FADE_IN + 'ms';
      el.style.setProperty('--from-scale', CFG.POPUP_SCALE_FROM);
      el.innerHTML = `
        <div class="ov-media">
          <video playsinline preload="auto"></video>
          <div class="ov-fallback" hidden>
            <strong>영상을 불러올 수 없습니다</strong>
            <span>네트워크 또는 이 미리보기 환경에서 영상 주소에 접근할 수 없습니다.</span>
          </div>
          <div class="ov-tab"><span class="ov-en"></span><span class="ov-kr"></span></div>
        </div>`;
      el.querySelector('.ov-en').textContent = ch;
      el.querySelector('.ov-kr').textContent = kr;
      popupsEl.appendChild(el);
      const video = el.querySelector('video');
      const p = this.active = { ch, el, video, timers: [], failed: false, started: false };
      setStatus('playing', ch + ' 재생 준비');

      // 등장: 다음 프레임에 클래스 추가 → opacity 0→1, scale 0.96→1 (0.5초)
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));

      video.addEventListener('ended', () => this.close('ended'));
      video.addEventListener('error', () => this.fail());
      video.addEventListener('playing', () => {
        p.started = true;
        setStatus('playing', ch + (video.muted ? ' 재생 중 (음소거)' : ' 재생 중'));
        // 'ended'가 오지 않는 경우를 대비한 안전 종료
        if (isFinite(video.duration) && video.duration > 0)
          p.timers.push(setTimeout(() => this.close(), (video.duration + 3) * 1000));
      }, { once: true });
      p.timers.push(setTimeout(() => { if (!p.started) this.fail(); }, CFG.VIDEO_START_TIMEOUT));

      video.src = CFG.VIDEOS[ch];
      video.muted = !CFG.VIDEO_TRY_SOUND;
      const tryPlay = () => video.play().catch(err => {
        if (err && err.name === 'NotAllowedError' && !video.muted) { video.muted = true; return tryPlay(); }
        if (err && err.name !== 'AbortError') this.fail();
      });
      tryPlay();
      return true;
    },

    fail() {
      const p = this.active;
      if (!p || p.failed || p.closing) return;
      p.failed = true;
      p.el.querySelector('.ov-fallback').hidden = false;
      setStatus('playing', p.ch + ' 영상 불러오기 실패');
      p.timers.push(setTimeout(() => this.close(), CFG.FALLBACK_SHOW_MS));
    },

    /** 영상 자연 종료·안내 후 종료·검지 회전 종료가 모두 이 함수 하나로 닫힘 (중복 호출 무시) */
    close(reason) {
      const p = this.active;
      if (!p || p.closing) return false;
      p.closing = true;
      p.timers.forEach(clearTimeout);
      try { p.video.pause(); } catch (e) {}   // 소리가 남지 않도록 즉시 정지
      setStatus('playing', p.ch + (reason === 'gesture' ? ' 닫는 중 (검지 회전)' : ' 닫는 중'));
      p.el.style.transitionDuration = CFG.POPUP_FADE_OUT + 'ms';
      p.el.classList.remove('show');
      p.el.classList.add('hide');
      setTimeout(() => {                       // 0.5초 퇴장 후 DOM에서 정리
        try { p.video.pause(); p.video.removeAttribute('src'); p.video.load(); } catch (e) {}
        p.el.remove();
        if (this.active === p) this.active = null;
        this.closedAt = performance.now();
        setStatus('playing', '대기');
        onPopupClosed();
      }, CFG.POPUP_FADE_OUT + 20);
      return true;
    },
  };

  /* ---------- 손동작 상태 (카메라·마우스 공통) ---------- */
  const G = {
    present: false, x: CFG.VIEW_W / 2, y: CFG.VIEW_H / 2, gesture: 'None', score: 0,
    openStreak: 0, fistStreak: 0, armed: false, lastOpenAt: -1e9, lastOpenTarget: null,
    hover: null, source: 'none', lastSeen: -1e9,
  };
  function nearestTarget(x, y) {
    let best = null, bd = CFG.HOVER_RADIUS;
    for (const t of TARGET_LIST) {
      const d = Math.hypot(t.x - x, t.y - y);
      if (d <= bd) { bd = d; best = t; }
    }
    return best;
  }
  /** 한 프레임의 입력 {present, x, y, gesture, score, source, t} */
  function feed(inp) {
    const t = inp.t ?? performance.now();
    G.source = inp.source;
    if (!inp.present) {
      if (t - G.lastSeen > CFG.HAND_LOST_MS) {
        G.present = false; G.openStreak = G.fistStreak = 0; G.armed = false; G.hover = null;
      }
      render(); return;
    }
    G.lastSeen = t;
    const k = inp.source === 'mouse' || !G.present ? 1 : CFG.CURSOR_SMOOTH;
    G.x += (inp.x - G.x) * k; G.y += (inp.y - G.y) * k;
    G.present = true;
    G.gesture = inp.gesture; G.score = inp.score;
    G.hover = nearestTarget(G.x, G.y);
    const ok = inp.score >= CFG.MIN_SCORE;
    const needOpen = inp.source === 'mouse' ? 1 : CFG.OPEN_FRAMES;
    const needFist = inp.source === 'mouse' ? 1 : CFG.FIST_FRAMES;
    if (inp.pointing) {
      // 검지 세운 자세: 커서는 움직이되 잡기는 해제 (주먹으로 잘못 분류돼도 팝업이 열리지 않음)
      G.armed = false; G.openStreak = 0; G.fistStreak = 0;
    } else if (ok && inp.gesture === 'Open_Palm') {
      G.openStreak++; G.fistStreak = 0;
      if (G.openStreak >= needOpen) { G.armed = true; G.lastOpenAt = t; G.lastOpenTarget = G.hover; }
    } else if (ok && inp.gesture === 'Closed_Fist') {
      G.fistStreak++; G.openStreak = 0;
      if (G.armed && G.fistStreak >= needFist && t - G.lastOpenAt <= CFG.GRAB_WINDOW_MS) {
        G.armed = false;                                  // 다시 손을 펴야 다음 잡기
        grab(G.hover || G.lastOpenTarget);
      }
    } else {
      G.openStreak = 0; G.fistStreak = 0;                 // 전환 중 프레임(None 등)은 준비 상태 유지
    }
    render();
  }
  function grab(target) {
    if (!target) { flash('교차지점 밖'); return; }
    if (Popup.busy()) { flash('재생 중 — 잡기 무시'); return; }
    Popup.open(target.ch);
  }
  /* ---------- 검지 회전 → 영상 닫기 ---------- */
  const Rot = window.SubwayRotation;
  const trackers = new Map();             // 손별 회전 기록 (왼손/오른손 분리)
  const trackerFor = key => {
    let tr = trackers.get(key);
    if (!tr) { tr = Rot.createRotationTracker(CFG.ROTATION); trackers.set(key, tr); }
    return tr;
  };
  function closeByRotation(key) {
    if (!Popup.active || Popup.active.closing) return;   // 재생 중일 때만 유효, 닫히는 중이면 무시
    setStatus('rotation', key + ' 회전 인식 → 닫기');
    Popup.close('gesture');
  }
  function onPopupClosed() {
    trackers.forEach(tr => tr.reset());   // 닫힘 완료 후 제스처 기록 초기화
    G.armed = false; G.openStreak = 0; G.fistStreak = 0;   // 다시 손을 편 뒤에만 다음 잡기
  }

  let flashTimer = 0;
  function flash(msg) {
    setStatus('target', msg);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { flashTimer = 0; render(); }, 900);
  }

  /* ---------- 커서 · 선택 표시 ---------- */
  function render() {
    const fist = G.gesture === 'Closed_Fist' && G.score >= CFG.MIN_SCORE;
    cursorEl.style.display = G.present ? '' : 'none';
    if (G.present) {
      cursorEl.style.transform = `translate(${G.x.toFixed(1)}px, ${G.y.toFixed(1)}px)`;
      cursorEl.classList.toggle('fist', fist);
      cursorEl.classList.toggle('over', !!G.hover && !Popup.busy());
    }
    const showHover = CFG.SHOW_HOVER_RING && G.present && G.hover && !Popup.busy();
    hoverEl.style.display = showHover ? '' : 'none';
    if (showHover) hoverEl.style.transform = `translate(${G.hover.x}px, ${G.hover.y}px)`;
    setStatus('hand', G.present ? (G.source === 'mouse' ? '마우스 커서' : '감지됨') : '없음');
    setStatus('gesture', G.present ? `${G.gesture}${G.source === 'camera' ? ' ' + G.score.toFixed(2) : ''}` : '—');
    if (!flashTimer) setStatus('target', G.hover ? `${G.hover.id} · ${G.hover.ch}` : '—');
  }

  /* ---------- 마우스 대체 입력 ---------- */
  let cameraLive = false, mouseDown = false, mouseRotate = false;
  // 마우스 테스트용 검지 손 모양 (손목 기준, 손 크기 1 단위) — 오른쪽 버튼 드래그 시 이 손이 커서를 따라 움직임
  const POINT_HAND = [[0,0],[-0.45,-0.25],[-0.6,-0.55],[-0.55,-0.8],[-0.4,-0.9],[-0.35,-1],[-0.35,-1.45],[-0.35,-1.75],[-0.35,-2],
    [0,-1],[0.05,-1.2],[0.1,-0.9],[0,-0.7],[0.3,-0.95],[0.32,-1.1],[0.35,-0.85],[0.3,-0.65],[0.55,-0.85],[0.58,-0.95],[0.58,-0.75],[0.5,-0.6]];
  function mouseRotateFrame(p, down) {
    const s = CFG.MOUSE_ROTATE_SCALE, tip = POINT_HAND[8];
    const lm = POINT_HAND.map(([x, y]) => [p.x + (x - tip[0]) * s, p.y + (y - tip[1]) * s]);
    const r = trackerFor('mouse').update(performance.now(), down ? lm : null, 'Pointing_Up', 1);
    setStatus('rotation', `mouse ${Math.round(r.deg)}°`);
    if (r.fired) closeByRotation('mouse');
  }
  function stagePoint(ev) {
    const r = stage.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width * CFG.VIEW_W, y: (ev.clientY - r.top) / r.height * CFG.VIEW_H };
  }
  if (CFG.MOUSE_FALLBACK) {
    stage.addEventListener('pointermove', ev => {
      if (cameraLive && G.source === 'camera' && G.present) return;
      const p = stagePoint(ev);
      if (mouseRotate) {
        feed({ present: true, ...p, gesture: 'Pointing_Up', score: 1, source: 'mouse', pointing: true });
        mouseRotateFrame(p, true);
        return;
      }
      feed({ present: true, ...p, gesture: mouseDown ? 'Closed_Fist' : 'Open_Palm', score: 1, source: 'mouse' });
    });
    stage.addEventListener('contextmenu', ev => ev.preventDefault());
    stage.addEventListener('pointerdown', ev => {
      if (cameraLive && G.source === 'camera' && G.present) return;
      const p = stagePoint(ev);
      if (ev.button === 2) {                 // 오른쪽 버튼: 검지 회전 시험
        mouseRotate = true;
        trackerFor('mouse').reset();
        feed({ present: true, ...p, gesture: 'Pointing_Up', score: 1, source: 'mouse', pointing: true });
        mouseRotateFrame(p, true);
        return;
      }
      if (ev.button !== 0) return;
      mouseDown = true;
      feed({ present: true, ...p, gesture: 'Open_Palm', score: 1, source: 'mouse' });
      feed({ present: true, ...p, gesture: 'Closed_Fist', score: 1, source: 'mouse' });
    });
    window.addEventListener('pointerup', ev => {
      if (mouseRotate && ev.button === 2) {
        mouseRotate = false;
        trackerFor('mouse').reset();
        feed({ present: true, ...stagePoint(ev), gesture: 'Open_Palm', score: 1, source: 'mouse' });
        return;
      }
      if (!mouseDown) return;
      mouseDown = false;
      const p = stagePoint(ev);
      feed({ present: true, ...p, gesture: 'Open_Palm', score: 1, source: 'mouse' });
    });
    stage.addEventListener('pointerleave', () => {
      if (G.source === 'mouse') feed({ present: false, source: 'mouse', t: performance.now() + CFG.HAND_LOST_MS + 1 });
    });
  }

  /* ---------- 카메라 한 프레임 결과 처리 (MediaPipe GestureRecognizerResult) ---------- */
  function handleResult(res, now, vw, vh) {
    const m = CFG.CAMERA_MARGIN;
    const all = (res && res.landmarks) || [];
    const sides = (res && (res.handedness || res.handednesses)) || [];
    
    // 손별 정보: 손바닥 중심(손목 + 손가락 뿌리 4개 평균), 분류 결과, 검지 자세, 손 구분 키
    const hands = all.map((lm, i) => {
      let cx = 0, cy = 0;
      for (const j of [0, 5, 9, 13, 17]) { cx += lm[j].x; cy += lm[j].y; }
      const top = res.gestures && res.gestures[i] && res.gestures[i][0];
      const side = sides[i] && sides[i][0] ? sides[i][0].categoryName : 'Hand';
      const px = lm.map(p => [p.x * vw, p.y * vh]);
      return { i, cx: cx / 5, cy: cy / 5, px, side,
        gesture: top ? top.categoryName : 'None', score: top ? top.score : 0 };
    });
    // 손 구분 키: 왼손/오른손 라벨 (같은 라벨이 둘이면 순서 번호를 붙여 기록이 섞이지 않게)
    const seen = {};
    hands.forEach(h => { seen[h.side] = (seen[h.side] || 0) + 1; h.key = seen[h.side] > 1 ? h.side + h.i : h.side; });
    // 회전 판정: 손마다 독립적으로, 보이지 않는 손은 '없음'으로 갱신
    const live = new Set();
    for (const h of hands) {
      live.add(h.key);
      const r = trackerFor(h.key).update(now, h.px, h.gesture, h.score);
      h.pointing = !!r.pointingNow;   // 잡기 안전장치는 이 프레임의 자세만 사용 (유예 시간 미적용)
      if (r.deg > 0) setStatus('rotation', `${h.key} ${Math.round(r.deg)}°`);
      if (r.fired) closeByRotation(h.key);
    }
    trackers.forEach((tr, key) => { if (key !== 'mouse' && !live.has(key)) tr.update(now, null); });
    if (!hands.length) { feed({ present: false, source: 'camera', t: now }); return; }
    // 커서는 한 손만: 직전 커서 손과 가장 가까운 손 (처음엔 첫 번째 손)
    let primary = hands[0];
    if (hands.length > 1 && G.present && G.source === 'camera') {
      let bd = Infinity;
      for (const h of hands) { const d = Math.hypot(h.cx - G.rawX, h.cy - G.rawY); if (d < bd) { bd = d; primary = h; } }
    }
    G.rawX = primary.cx; G.rawY = primary.cy;
    const u = Math.min(1, Math.max(0, ((1 - primary.cx) - m) / (1 - 2 * m)));   // 거울 모드
    const v = Math.min(1, Math.max(0, (primary.cy - m) / (1 - 2 * m)));
    feed({
      present: true, x: u * CFG.VIEW_W, y: v * CFG.VIEW_H,
      gesture: primary.pointing ? 'Pointing_Up' : primary.gesture, score: primary.score,
      pointing: primary.pointing, source: 'camera', t: now,
    });
  }

  /* ---------- 카메라 + MediaPipe Gesture Recognizer ---------- */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('input', '카메라 없음 · 마우스'); return;
    }
    setStatus('input', '카메라 권한 요청 중');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
      });
    } catch (e) {
      setStatus('input', '카메라 사용 불가 · 마우스'); return;
    }
    camEl.srcObject = stream;
    try { await camEl.play(); } catch (e) {}
    setStatus('input', '손 인식 모델 불러오는 중');
    let recognizer;
    try {
      const base = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${CFG.MP_VERSION}`;
      const mp = await import(`${base}/vision_bundle.mjs`);
      const files = await mp.FilesetResolver.forVisionTasks(`${base}/wasm`);
      const make = delegate => mp.GestureRecognizer.createFromOptions(files, {
        baseOptions: { modelAssetPath: CFG.MODEL_URL, delegate },
        runningMode: 'VIDEO', numHands: CFG.NUM_HANDS,
      });
      try { recognizer = await make('GPU'); } catch (e) { recognizer = await make('CPU'); }
    } catch (e) {
      console.warn('[gesture] model load failed', e);
      setStatus('input', '손 인식 모델 실패 · 마우스');
      stream.getTracks().forEach(tr => tr.stop());
      return;
    }
    cameraLive = true;
    setStatus('input', '카메라 · 손동작');
    let lastVideoTime = -1;
    const m = CFG.CAMERA_MARGIN;
    const loop = () => {
      requestAnimationFrame(loop);
      if (camEl.readyState < 2 || camEl.currentTime === lastVideoTime) return;
      lastVideoTime = camEl.currentTime;
      const now = performance.now();
      let res;
      try { res = recognizer.recognizeForVideo(camEl, now); } catch (e) { return; }
      handleResult(res, now, camEl.videoWidth || 640, camEl.videoHeight || 480);
    };
    requestAnimationFrame(loop);
  }

  render();
  startCamera();

  // 확인용 훅 (화면에는 영향 없음)
  window.__subwayGesture = { CFG, FRAMES, CARD: { w: CARD_W, h: CARD_H, video: [VIDEO_W, CFG.VIDEO_H] }, feed, Popup, state: G, status, camEl, trackers, trackerFor, closeByRotation, handleResult };
})();

</script>
